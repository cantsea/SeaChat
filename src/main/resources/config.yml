
announcements:
  enabled: true

chat-format:
  enabled: true

  # PlaceholderAPI values can contain nested placeholders (up to 10 levels).
  format: "%luckperms_prefix%<reset> {player} %luckperms_suffix% <message>"

  # Message text color for players who use /chat toggle colors to disable colors.
  # Use a color name (e.g. gray) or a quoted hex color (e.g. "#AABBCC").
  # Missing or invalid values use white. Apply changes with /chat reload.
  disabled-color: "white"

slowmode:
  enabled: true

  cooldown-seconds: 2

display:
  enabled: true

  cooldown-seconds: 10

  snapshots:
    enabled: true

    expire-seconds: 300

    cleanup-interval-seconds: 300

private-chats:
  local:
    enabled: true
    toggleable: true
    format: "<b><#FFFF55>[LOCAL] {sender} »<reset><#FFFF55> <message>"
    permission: "seachat.chat.local"
    command: "lc"

filters:
  caps:
    enabled: true

    threshold-percent: 80

    minimum-letters: 5

  bad-words:
    enabled: true

    words:
      - "bastard"
      - "bitch"
      - "shit"
      - "cock"
      - "cunt"
      - "dick"
      - "douche"
      - "fag"
      - "fuck"
      - "nigga"
      - "nigger"
      - "piss"
      - "prick"
      - "pussy"
      - "retard"
      - "slut"
      - "whore"

