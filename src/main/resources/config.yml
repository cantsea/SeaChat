
announcements:
  enabled: true

chat-format:
  enabled: true

  # PlaceholderAPI values can contain nested placeholders (up to 10 levels).
  # Hand, inventory, and ender chest displays use this format, with their clickable label in <message>.
  format: "%luckperms_prefix%<reset>%cosmetics_title%<reset>%cosmetics_nickname_prefix%%cosmetics_nickname_color%%cosmetics_nickname% <%cosmetics_symbol_style_color%>» %luckperms_suffix%%cosmetics_chat_color%<message>"

  # Message text color for players who use /chat toggle colors to disable colors.
  # Use a color name (e.g. gray) or a quoted hex color (e.g. "#AABBCC").
  # Missing or invalid values use white. Apply changes with /chat reload.
  disabled-color: "gray"

slowmode:
  enabled: true

  cooldown-seconds: 2

display:
  enabled: true

  cooldown-seconds: 30

  snapshots:
    enabled: true

    expire-seconds: 60

    cleanup-interval-seconds: 120

private-chats:
  local:
    enabled: true
    toggleable: true
    format: "<b><#FFFF55>[LOCAL] {sender} »<reset><#FFFF55> <message>"
    permission: "seachat.chat.local"
    command: "lc"

filters:
  caps:
    enabled: true

    threshold-percent: 80

    minimum-letters: 5

  bad-words:
    enabled: true

    words:
      - "bastard"
      - "bitch"
      - "shit"
      - "cock"
      - "cunt"
      - "dick"
      - "douche"
      - "fag"
      - "fuck"
      - "nigga"
      - "nigger"
      - "piss"
      - "prick"
      - "pussy"
      - "retard"
      - "slut"
      - "whore"